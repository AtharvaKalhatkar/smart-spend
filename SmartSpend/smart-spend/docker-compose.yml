version: '3.8'
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: expense-ai-db
    environment:
      POSTGRES_USER: atharva
      POSTGRES_PASSWORD: password
      POSTGRES_DB: expense_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: